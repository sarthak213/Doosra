name: Desktop app

# Builds DoosraSetup-<version>.exe on Windows and publishes it as a GitHub release, which installed
# copies of Doosra offer as an update.
#
# Releasing is part of merging: a merge to main that changes VERSION in backend/version.py (a PR that
# bumps it) builds, tests and publishes app-v<version> automatically. Merges that don't change the
# version, or a version that's already released, don't. A tag pushed by hand still releases
# (git tag app-v2.5.0 && git push origin app-v2.5.0), and a manual run just builds the installer
# and keeps it as a workflow artifact.

on:
  push:
    branches: [main]
    paths: [backend/version.py]
    tags: ["app-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide what this run does: build only, build and release, or nothing (the version's out already).
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep "^VERSION = " backend/version.py | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            if [[ "${GITHUB_REF#refs/tags/app-v}" != "$v" ]]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match backend/version.py ($v)"; exit 1
            fi
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if gh release view "app-v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Doosra $v is already released; nothing to do."
              echo "build=false" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
            else
              echo "New version $v on main: building and releasing app-v$v."
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pyinstaller pywebview

      # The pinned llama.cpp builds (desktop/fetch_engine.py checks their sha256)
      - uses: actions/cache@v4
        with:
          path: desktop/build/engine
          key: llama-${{ hashFiles('desktop/fetch_engine.py') }}

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # frontend, engine, Doosra.exe, its --self-test, then the installer
      - run: python desktop/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: DoosraSetup-${{ env.VERSION }}
          path: desktop/dist/DoosraSetup-${{ env.VERSION }}.exe
          if-no-files-found: error

      - name: Release
        if: needs.check.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Doosra $VERSION for Windows 10 and 11 (64-bit).

          Download **DoosraSetup-$VERSION.exe** and run it. It installs for your user, with no admin
          prompt. On first launch Doosra downloads the cricket database (about 430 MB) and an AI model
          (2.7 or 5.6 GB) once; everything then runs on your PC.

          The installer isn't code-signed yet, so Windows SmartScreen may say it "protected your PC":
          click **More info**, then **Run anyway**.

          Already installed? Doosra offers this update in Settings.
          EOF
          gh release create "app-v$VERSION" "desktop/dist/DoosraSetup-$VERSION.exe" \
            --title "Doosra $VERSION" --notes-file notes.md --generate-notes --target "$GITHUB_SHA" --latest
