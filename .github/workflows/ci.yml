name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Fixture databases only: the real-DB eval skips without data/cricket.duckdb.
      - run: pytest -q -m "not llm"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # The hosted image: builds, starts (without downloading the database) and answers.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t doosra .
      - name: Smoke test
        run: |
          docker run -d --name doosra -p 8000:8000 -e SKIP_DB_PULL=1 -e SESSION_SECRET=$(head -c 48 /dev/urandom | base64 | tr -d '\n=+/') \
            -e PUBLIC_URL=http://localhost:8000 -e ADMIN_EMAILS=ci@example.com doosra
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health | grep '"status":"ok"'
          curl -sf localhost:8000/api/me | grep '"user":null'                 # signed out
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/projects)" = 401
          curl -sf localhost:8000/ask/some-chat | grep -i '<title>'           # the app, for a client-side route
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/mcp)" = 404   # MCP is not served when hosted
      - if: failure()
        run: docker logs doosra
